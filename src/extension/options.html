<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ČSFD - Letterboxd Link</title>
  <link rel="stylesheet" href="./settings.css">
</head>
<body>
  <main>
    <h1 data-i18n="extensionName"></h1>
    <p data-i18n="extensionDescription"></p>
    <fieldset>
      <legend data-i18n="optionsTitle"></legend>
      <label for="mode" data-i18n="modeLabel"></label>
    <select id="mode" name="mode" disabled>
      <option value="auto" data-i18n="mode_auto"></option>
      <option value="csfd_only" data-i18n="mode_csfd_only"></option>
      <option value="wikidata_only" data-i18n="mode_wikidata_only"></option>
      <option value="search_only" data-i18n="mode_search_only"></option>
    </select>
      <label for="theme" data-i18n="themeLabel"></label>
      <select id="theme" name="theme" disabled>
        <option value="auto" data-i18n="theme_auto"></option>
        <option value="light" data-i18n="theme_light"></option>
        <option value="dark" data-i18n="theme_dark"></option>
      </select>
      <label class="toggle">
        <input type="checkbox" name="fallbackToSearch" disabled>
        <span data-i18n="fallbackLabel"></span>
      </label>
      <label class="toggle">
        <input type="checkbox" name="cacheEnabled" disabled>
        <span data-i18n="cacheLabel"></span>
      </label>
      <label class="toggle">
        <input type="checkbox" name="openInNewTab" disabled>
        <span data-i18n="newTabLabel"></span>
      </label>
      <button id="clear-cache" type="button" data-i18n="clearCache"></button>
      <p id="settings-status" role="status"></p>
    </fieldset>
    <section>
      <h2 data-i18n="privacyTitle"></h2>
      <p data-i18n="privacyInfo"></p>
    </section>
  </main>
  <script type="module" src="./settings-ui.ts"></script>
</body>
</html>
